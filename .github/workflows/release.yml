name: Release

# Manual only: Actions -> Release -> Run workflow.
# Builds the signed APK + AAB and publishes a GitHub Release.
# Secrets: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD (docs/ci-cd.md)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Must match versionName in app/build.gradle.kts.'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '25'

jobs:
  release:
    name: Signed APK + AAB + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Tag must look like v0.1.0 (optional suffix allowed)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag against versionName
        env:
          TAG: ${{ inputs.tag }}
        run: |
          NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "${TAG#v}" != "$NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $NAME in app/build.gradle.kts."
            exit 1
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android platform 37
        run: bash .github/scripts/install-android-sdk.sh

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is required. See docs/ci-cd.md"
              exit 1
            fi
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/ci-upload.jks"
          {
            echo "storeFile=ci-upload.jks"
            echo "storePassword=${SIGNING_STORE_PASSWORD}"
            echo "keyAlias=${SIGNING_KEY_ALIAS}"
            echo "keyPassword=${SIGNING_KEY_PASSWORD}"
          } > signing.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build signed release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Stage release artifacts
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist/release
          VERSION="${TAG#v}"
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/release/app-release.apk "dist/release/Niriun-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/release/Niriun-${VERSION}.aab"
          (cd dist/release && sha256sum Niriun-*.apk Niriun-*.aab | tee SHA256SUMS.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: niriun-release-${{ inputs.tag }}
          path: |
            dist/release/*.apk
            dist/release/*.aab
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          EXTRA=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA+=(--prerelease)
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; attaching assets to release."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/*.apk dist/release/*.aab dist/release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/release/*.apk dist/release/*.aab dist/release/SHA256SUMS.txt \
              --title "Niriun ${TAG}" --generate-notes "${EXTRA[@]}"
          fi
