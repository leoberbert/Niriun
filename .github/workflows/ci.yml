name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches gradle/gradle-daemon-jvm.properties (toolchain 25).
  JAVA_VERSION: '25'

jobs:
  build:
    name: Unit tests + debug APK + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # Compose BOM requires compileSdk 37.
      - name: Install Android platform 37
        run: bash .github/scripts/install-android-sdk.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests, debug APK and lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-debug
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
